name: Update requirements.txt on major or minor version changes

on:
  push:
  workflow_dispatch:

jobs:
  compare-pyproject:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run comparison
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "There is no previous commit to compare."
            exit 0
          fi

          if ! git cat-file -e "HEAD^:pyproject.toml" 2>/dev/null; then
            echo "The previous commit did not contain pyproject.toml."
            exit 0
          fi

          previous_pyproject_path="$RUNNER_TEMP/previous-pyproject.toml"
          current_pyproject_path="$GITHUB_WORKSPACE/pyproject.toml"

          git show HEAD^:pyproject.toml > "$previous_pyproject_path"

          ls
          python3 scripts/main.py \
            "$previous_pyproject_path" \
            "$current_pyproject_path"
